name: LG TV app (webOS IPK)

# The light LG TV app (folder tvlite/): plain HTML, CSS and JavaScript with the TV's own video
# player — no engine to load, so it opens at once and stays smooth on every LG TV.
#
# Result: release "webos-latest" with the .ipk. Install it on an LG TV in Developer Mode with
# webOS Dev Manager / ares-install, or upload it in LG Seller Lounge (LG signs store apps itself).

on:
  push:
    branches: [main]
    paths: ['tvlite/**', 'tools/build_tvlite.py', 'tools/fetch_brand.py', 'brand/icon.png', 'brand/brand.txt', '.github/workflows/webos.yml']
  workflow_dispatch:

concurrency:
  group: webos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply the brand
        run: |
          get() { grep -E "^$1=" brand/brand.txt | head -1 | cut -d= -f2- | sed 's/[[:space:]]*$//'; }
          APP_NAME="$(get APP_NAME)"; PACKAGE_ID="$(get PACKAGE_ID)"; WEBSITE="$(get WEBSITE)"
          # The LG app has its own ID (registered in LG Seller Lounge); the Android package stays as it is.
          LG_APP_ID="$(get LG_APP_ID)"; [ -n "$LG_APP_ID" ] && PACKAGE_ID="$LG_APP_ID"
          WEBSITE="${WEBSITE%/}"
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow || true
          python3 tools/fetch_brand.py "$WEBSITE" || true
          if [ -s brand/site_label.txt ]; then APP_NAME="$(cat brand/site_label.txt)"; fi
          APK_NAME="$(echo "$APP_NAME" | tr -cd '[:alnum:]')"; [ -n "$APK_NAME" ] || APK_NAME=App
          { echo "APP_NAME=$APP_NAME"; echo "APP_ID=$PACKAGE_ID"; echo "APK_NAME=$APK_NAME"; echo "WEBSITE=$WEBSITE"; } >> "$GITHUB_ENV"

      - name: Build the IPK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p out
          python3 tools/build_tvlite.py --out out --name "$APP_NAME" --site "$WEBSITE" --id "$APP_ID" \
            --version "2.0.$BUILD_NUMBER" --build "$BUILD_NUMBER" --file "$APK_NAME.ipk" --folder out/app 2>&1 | tee out/build.log
          # The package must hold everything the TV needs.
          python3 - <<'PY' 2>&1 | tee -a out/build.log
          import io, json, os, sys, tarfile
          name = os.environ['APK_NAME'] + '.ipk'
          data = open('out/' + name, 'rb').read()
          assert data.startswith(b'!<arch>\n'), 'not an ar archive'
          pos, members = 8, {}
          while pos < len(data):
              head = data[pos:pos + 60]
              mname = head[:16].decode().strip().rstrip('/')
              size = int(head[48:58].decode().strip())
              members[mname] = data[pos + 60:pos + 60 + size]
              pos += 60 + size + (size % 2)
          assert list(members) == ['debian-binary', 'control.tar.gz', 'data.tar.gz'], list(members)
          names = tarfile.open(fileobj=io.BytesIO(members['data.tar.gz'])).getnames()
          app = [n for n in names if n.endswith('/appinfo.json')][0].rsplit('/', 1)[0]
          for need in ('index.html', 'js/config.js', 'js/main.js', 'css/app.css', 'icon.png', 'largeIcon.png', 'img/symbol.png'):
              assert app + '/' + need in names, 'missing ' + need
          info = json.load(tarfile.open(fileobj=io.BytesIO(members['data.tar.gz'])).extractfile(app + '/appinfo.json'))
          print('package ok:', info['id'], info['version'], info['title'], len(names), 'entries')
          PY
          for f in out/app/js/*.js; do node --check "$f"; done
          echo "APPID=$APP_ID" >> "$GITHUB_ENV"
          ls -la out

      - name: Publish to the "webos-latest" release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=""
          [ -f "out/$APK_NAME.ipk" ] && [ "${{ steps.build.outcome }}" = "success" ] && FILES="out/$APK_NAME.ipk"
          TITLE="$APP_NAME LG TV - build #$BUILD_NUMBER (light app 2.0.$BUILD_NUMBER)"
          [ -z "$FILES" ] && TITLE="$TITLE FAILED"
          {
            echo "LG Smart TV (webOS) package — the light app: plain web page + the TV's own video player."
            echo "Install on a TV in Developer Mode (webOS Dev Manager / ares-install) or upload it in LG Seller Lounge."
            echo ""
            echo "webOS app id: ${APPID:-?}  ·  version 2.0.$BUILD_NUMBER"
            if [ -z "$FILES" ]; then
              echo ""
              echo "### Errors"
              echo '```'
              tail -40 out/build.log 2>/dev/null | cut -c1-300 || true
              echo '```'
            fi
          } > out/NOTES.md
          if gh release view webos-latest >/dev/null 2>&1; then
            [ -n "$FILES" ] && gh release upload webos-latest $FILES --clobber
            gh release edit webos-latest --title "$TITLE" --notes-file out/NOTES.md --prerelease
          else
            gh release create webos-latest $FILES --target "$GITHUB_SHA" --title "$TITLE" --notes-file out/NOTES.md --prerelease
          fi
