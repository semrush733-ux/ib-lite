name: Samsung TV app (Tizen WGT)

# The light TV app (folder tvlite/, the same app as on LG TVs) packed for Samsung Smart TVs (Tizen):
# plain HTML, CSS and JavaScript with the TV's own video player, so it opens at once and runs on
# Samsung TVs from 2018 on (Tizen 4.0+). Samsung's own parts (remote keys, the TV's id and MAC,
# no screensaver while a video plays, the exit question) switch on only on a Samsung TV.
#
# Result: release "tizen-latest" with LitePlayer.wgt (NOT signed yet).
# A Samsung TV only installs a .wgt signed with a Samsung certificate (free, made in Tizen Studio
# with a Samsung account). Sign it there (Tizen Studio → Certificate Manager → Samsung) and install
# it with Device Manager on a TV in Developer Mode, or upload it to Samsung Seller Office.

on:
  push:
    branches: [main]
    paths: ['tvlite/**', 'tools/build_tvlite.py', 'tools/fetch_brand.py', 'brand/icon.png', 'brand/brand.txt', '.github/workflows/tizen.yml']
  workflow_dispatch:

concurrency:
  group: tizen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  wgt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply the brand
        run: |
          get() { grep -E "^$1=" brand/brand.txt | head -1 | cut -d= -f2- | sed 's/[[:space:]]*$//'; }
          APP_NAME="$(get APP_NAME)"; PACKAGE_ID="$(get PACKAGE_ID)"; WEBSITE="$(get WEBSITE)"
          WEBSITE="${WEBSITE%/}"
          # Samsung app id part and file name stay as they were (LitePlayer): the same app on the TVs.
          APPN="$(echo "$APP_NAME" | tr -cd '[:alnum:]' | cut -c1-40)"; [ -n "$APPN" ] || APPN=App
          python3 -m pip install --quiet pillow || python3 -m pip install --quiet --break-system-packages pillow || true
          python3 tools/fetch_brand.py "$WEBSITE" || true
          if [ -s brand/site_label.txt ]; then APP_NAME="$(cat brand/site_label.txt)"; fi
          { echo "APP_NAME=$APP_NAME"; echo "APP_ID=$PACKAGE_ID"; echo "APPN=$APPN"; echo "WEBSITE=$WEBSITE"; } >> "$GITHUB_ENV"

      - name: Build the WGT
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p out
          python3 tools/build_tvlite.py --target tizen --out out --name "$APP_NAME" --site "$WEBSITE" --id "$APP_ID" \
            --tizen-app "$APPN" --version "2.0.$BUILD_NUMBER" --build "$BUILD_NUMBER" --file "$APPN.wgt" --folder out/app 2>&1 | tee out/build.log
          # The package must hold everything the TV needs, with a valid Samsung description.
          python3 - <<'PY' 2>&1 | tee -a out/build.log
          import os, re, zipfile
          import xml.etree.ElementTree as ET
          z = zipfile.ZipFile('out/' + os.environ['APPN'] + '.wgt')
          names = z.namelist()
          for need in ('config.xml', 'index.html', 'icon.png', 'js/config.js', 'js/main.js', 'css/app.css', 'img/symbol.png'):
              assert need in names, 'missing ' + need
          root = ET.fromstring(z.read('config.xml'))
          T = '{http://tizen.org/ns/widgets}'
          app = root.find(T + 'application')
          assert re.fullmatch(r'[A-Za-z0-9]{10}', app.get('package')), app.get('package')
          assert app.get('id').startswith(app.get('package') + '.'), app.get('id')
          assert re.fullmatch(r'\d+\.\d+\.\d+', root.get('version')), root.get('version')
          privs = [p.get('name') for p in root.findall(T + 'privilege')]
          assert 'http://tizen.org/privilege/tv.inputdevice' in privs
          html = z.read('index.html').decode()
          assert '$WEBAPIS/webapis/webapis.js' in html
          assert '"samsung-tv"' in z.read('js/config.js').decode()
          print('package ok:', app.get('id'), root.get('version'), root.findtext('{http://www.w3.org/ns/widgets}name'), len(names), 'files')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('TZID=%s\n' % app.get('id'))
          PY
          for f in out/app/js/*.js; do node --check "$f"; done
          ls -la out

      - name: Publish to the "tizen-latest" release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=""
          [ -f "out/$APPN.wgt" ] && [ "${{ steps.build.outcome }}" = "success" ] && FILES="out/$APPN.wgt"
          TITLE="$APP_NAME Samsung TV - build #$BUILD_NUMBER (light app 2.0.$BUILD_NUMBER)"
          [ -z "$FILES" ] && TITLE="$TITLE FAILED"
          {
            echo "Samsung Smart TV (Tizen 4.0+, TVs from 2018) package — the light app, the same as on LG TVs."
            echo "Not signed yet: sign it in Tizen Studio with your Samsung certificate, then install it with Device Manager (TV in Developer Mode) or upload it to Samsung Seller Office."
            echo ""
            echo "Tizen app id: ${TZID:-?}  ·  version 2.0.$BUILD_NUMBER"
            if [ -z "$FILES" ]; then
              echo ""
              echo "### Errors"
              echo '```'
              tail -40 out/build.log 2>/dev/null | cut -c1-300 || true
              echo '```'
            fi
          } > out/NOTES.md
          if gh release view tizen-latest >/dev/null 2>&1; then
            [ -n "$FILES" ] && gh release upload tizen-latest $FILES --clobber
            gh release edit tizen-latest --title "$TITLE" --notes-file out/NOTES.md --prerelease
          else
            gh release create tizen-latest $FILES --target "$GITHUB_SHA" --title "$TITLE" --notes-file out/NOTES.md --prerelease
          fi
