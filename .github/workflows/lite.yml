name: Lite Player app

# Builds the B1G IPTV player (Flutter) for Fire TV / Android TV in the cloud.
#
# Result: release "latest" of this repository with LitePlayer.apk (the name follows brand/brand.txt)
#   https://github.com/<owner>/<repo>/releases/tag/latest
#
# Brand: brand/brand.txt (name, package, website) and brand/icon.png + brand/logo.png.
#
# Cast photos: add the secret TMDB_API_KEY (your key from themoviedb.org) and the movie details page
# shows cast photos, stills and trailers. Without it the page shows what the IPTV server knows.
#
# Signing: with the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD the APK is signed with your own key. Without them it is signed with a
# throw-away key: it installs, but a later build cannot update it (uninstall first).

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'recorder/**', '.github/workflows/recorder.yml', 'admin_app/**', 'brand/admin-icon.png', 'brand/make-admin-icon.py', '.github/workflows/admin-ios.yml', '.github/workflows/admin.yml', '.github/workflows/ios.yml', '.github/workflows/tizen.yml', 'tizen/**', '.github/workflows/webos.yml', 'webos/**', '.github/workflows/play.yml', 'tvlite/**', 'tools/build_tvlite.py', 'tools/make_demo_art.py']
  # "Run workflow" button in GitHub Actions: rebuild with the icon set in the website admin.
  workflow_dispatch:
  # Every hour: when the app name or icon was changed in the website admin (App look), a new
  # build is made by itself. Nothing is built when nothing changed.
  schedule:
    - cron: '23 * * * *'

concurrency:
  # The hourly check has its own group, so it never cancels a build that is running.
  group: lite-${{ github.ref }}-${{ github.event_name == 'schedule' && 'auto' || 'main' }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  # Hourly runs only: did the website's app name / icon change since the last build?
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          site="$(grep -E '^WEBSITE=' brand/brand.txt | head -1 | cut -d= -f2- | sed 's/[[:space:]]*$//; s|/$||')"
          if [ -z "$site" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          want="$(curl -fsS --max-time 20 "$site/wp-json/b1g/v1/app/config" | python3 -c '
          import json, re, sys
          b = (json.load(sys.stdin).get("config") or {}).get("brand") or {}
          label = re.sub(r"[^\w .()+-]", "", (b.get("app_label") or "").strip().replace("&", "and"))
          label = re.sub(r"\s+", " ", label).strip()[:30]
          print("%s|%s" % (label, (b.get("icon") or "").strip()))' 2>/dev/null || true)"
          have="$(gh release view latest --json body -q .body 2>/dev/null | sed -n 's/^Brand: //p' | head -1)"
          echo "website: [$want]  last build: [$have]"
          if [ -n "$want" ] && [ "$want" != "|" ] && [ "$want" != "$have" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      # Brand: name, package and website from brand/brand.txt; icons and logos from brand/*.png.
      - name: Apply the brand
        run: |
          get() { grep -E "^$1=" brand/brand.txt | head -1 | cut -d= -f2- | sed 's/[[:space:]]*$//'; }
          APP_NAME="$(get APP_NAME)"; PACKAGE_ID="$(get PACKAGE_ID)"; WEBSITE="$(get WEBSITE)"
          WEBSITE="${WEBSITE%/}"
          API_BASE=""; [ -n "$WEBSITE" ] && API_BASE="$WEBSITE/wp-json/b1g/v1"
          APK_NAME="$(echo "$APP_NAME" | tr -cd '[:alnum:]')"; [ -n "$APK_NAME" ] || APK_NAME=App
          { echo "APP_NAME=$APP_NAME"; echo "APP_ID=$PACKAGE_ID"; echo "API_BASE=$API_BASE"; echo "APK_NAME=$APK_NAME"; } >> "$GITHUB_ENV"
          echo "brand: $APP_NAME ($PACKAGE_ID) website: ${WEBSITE:-(not set)}"
          python3 -m pip install --quiet pillow || true
          python3 tools/fetch_brand.py "$WEBSITE"
          # The name under the icon set on the website wins over brand/brand.txt (the APK's file
          # name stays the same, so download links keep working).
          if [ -s brand/site_label.txt ]; then
            APP_NAME="$(cat brand/site_label.txt)"
            echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
            echo "app name from the website: $APP_NAME"
          fi
          python3 tools/brand_icons.py
          mkdir -p out && (cd store_assets && zip -qr ../out/store-assets.zip .)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated from Flutter's own template, then the files in
      # android_overlay/ (manifest for TV, activity, icons, banner) are copied over it.
      - name: Create the Android project
        run: |
          flutter --version
          echo "FLUTTER_VERSION=$(flutter --version | head -1 | awk '{print $2}')" >> "$GITHUB_ENV"
          flutter create --no-pub --platforms=android --org com.b1g --project-name b1gtv "$RUNNER_TEMP/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/android" android
          cp -r android_overlay/. android/
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"$APP_NAME\"|" android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle.kts ]; then
            cat android_extra/app-build-extra.gradle.kts >> android/app/build.gradle.kts
          else
            cat android_extra/app-build-extra.gradle >> android/app/build.gradle
          fi
          mkdir -p out/logs

      - name: Get packages
        run: flutter pub get

      - name: Check the code
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee out/logs/analyze.log

      - name: Unit tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee out/logs/test.log

      # Test build for the emulator (64-bit Intel, mock server pre-filled). Never published.
      - name: Build the test app
        env:
          B1G_ABIS: x86_64
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-x64 \
            --dart-define=APP_NAME="$APP_NAME" --dart-define=B1G_VERBOSE=true --dart-define=B1G_NO_AUTO_DIRECT=true --dart-define=B1G_TMDB_KEY=test --dart-define=B1G_TMDB_BASE=http://10.0.2.2:8787/3 --dart-define=B1G_TMDB_IMAGES=http://10.0.2.2:8787/t/p --dart-define=B1G_API_BASE=http://10.0.2.2:8787/wp-json/b1g/v1 --dart-define=B1G_PREFILL_SERVER=http://10.0.2.2:8787 --dart-define=B1G_PREFILL_USER=demo --dart-define=B1G_PREFILL_PASS=demo \
            2>&1 | tee out/logs/build-test.log
          mkdir -p out-smoke
          cp build/app/outputs/flutter-apk/app-release.apk out-smoke/b1g-smoke.apk

      - name: Build B1G.apk
        env:
          B1G_ABIS: armeabi-v7a,arm64-v8a
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -o pipefail
          SERVER="$(tr -d ' \r\n' < config/server.txt)"
          echo "locked server address: ${SERVER:-(none - customers type it)}"
          if [ -n "$TMDB_API_KEY" ]; then echo "TMDB key: set (cast photos on)"; else echo "TMDB key: not set (cast photos off)"; fi
          echo "TMDB_KEY_SET=$([ -n "$TMDB_API_KEY" ] && echo true || echo false)" >> "$GITHUB_ENV"
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --build-name "1.0.$BUILD_NUMBER" --build-number "$BUILD_NUMBER" \
            --dart-define=B1G_SERVER="$SERVER" --dart-define=B1G_TMDB_KEY="$TMDB_API_KEY" \
            --dart-define=APP_NAME="$APP_NAME" --dart-define=B1G_API_BASE="$API_BASE" \
            2>&1 | tee out/logs/build.log
          cp build/app/outputs/flutter-apk/app-release.apk out/B1G.apk

      - name: Sign with your own key
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/B1G-signed.apk" out/B1G.apk
          mv "$RUNNER_TEMP/B1G-signed.apk" out/B1G.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify the APK and write the build report
        if: always()
        run: |
          mkdir -p out
          R=out/REPORT.md
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "## B1G build #$BUILD_NUMBER"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`  -  Flutter $FLUTTER_VERSION"
            echo ""
            echo '```'
            echo "signed with your own key: $HAS_SIGNING"
            echo "TMDB key in this build (cast photos): ${TMDB_KEY_SET:-false}"
            if [ -f out/B1G.apk ]; then
              echo "B1G.apk  $(stat -c%s out/B1G.apk) bytes  sha256 $(sha256sum out/B1G.apk | cut -d' ' -f1)"
              "$BT/aapt2" dump badging out/B1G.apk | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:|^uses-permission|launchable-activity|^uses-feature|^native-code|^leanback" || true
              echo "--- signature"
              "$BT/apksigner" verify --print-certs out/B1G.apk 2>&1 | head -3 || true
              echo "--- manifest"
              "$BT/aapt2" dump xmltree --file AndroidManifest.xml out/B1G.apk | grep -E "usesCleartextTraffic|banner|LEANBACK_LAUNCHER|screenOrientation" | sed 's/^ *//' || true
            else
              echo "B1G.apk was NOT built"
            fi
            echo '```'
            echo "### Code check"
            echo '```'
            tail -45 out/logs/analyze.log 2>/dev/null || true
            echo '```'
            echo "### Unit tests"
            echo '```'
            tail -3 out/logs/test.log 2>/dev/null || true
            echo '```'
            echo "### Errors"
            echo '```'
            grep -hE "^e: |error:|Error:|FAILED|What went wrong|error -" out/logs/*.log 2>/dev/null | sort -u | head -60 || true
            echo "(end)"
            echo '```'
            if grep -qs "What went wrong" out/logs/build*.log; then
              echo "### Build failure details"
              echo '```'
              grep -hE "^e: |Execution failed|incompatible version|Could not|Unresolved reference|uses-sdk|minSdk|compileSdk" out/logs/build*.log 2>/dev/null | cut -c1-320 | sort -u | head -40 || true
              echo "---"
              grep -h -A 45 "What went wrong" out/logs/build*.log 2>/dev/null | cut -c1-320 | head -110 || true
              echo '```'
            fi
            if grep -qs "What went wrong" out/logs/build*.log; then
              echo "### Build failure details"
              echo '```'
              grep -hE "^e: |^w: .*(error|Error)|Execution failed|incompatible version|requires|Could not|Unresolved reference|uses-sdk|minSdk|compileSdk" out/logs/build*.log 2>/dev/null | cut -c1-320 | sort -u | head -40 || true
              echo "---"
              grep -h -A 45 "What went wrong" out/logs/build*.log 2>/dev/null | cut -c1-320 | head -110 || true
              echo '```'
            fi
          } > "$R"
          cat "$R"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1g-tv
          path: out/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: b1g-smoke
          path: out-smoke/
          retention-days: 3

      # A failed build still publishes its report (so the errors can be read), but never replaces a good APK.
      # Not when the run was cancelled (a newer one replaces it): it would mark the release FAILED.
      - name: Publish to the "latest" release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=""
          if [ -f out/B1G.apk ]; then cp out/B1G.apk "out/$APK_NAME.apk"; FILES="out/$APK_NAME.apk"; fi
          # Icons and banners for app stores (Amazon, Google Play) and Samsung Tizen.
          if [ -n "$FILES" ] && [ -f out/store-assets.zip ]; then FILES="$FILES out/store-assets.zip"; fi
          # Until the emulator test (job "smoke") has opened the app, the title says so: the website's
          # "Follow new builds automatically" does not announce such a build to the TVs. The smoke job
          # then sets "… build #N" (app opens) or "… build #N FAILED: …" (it does not).
          TITLE="$APP_NAME - build #$BUILD_NUMBER (emulator test running)"
          # What brand this build used (the hourly check compares it with the website).
          if [ -n "$FILES" ] && [ -s out/brand_sig.txt ]; then { echo ""; echo "Brand: $(cat out/brand_sig.txt)"; } >> out/REPORT.md; fi
          if [ -z "$FILES" ]; then TITLE="$APP_NAME - build #$BUILD_NUMBER FAILED (APK below is from an earlier build)"; fi
          publish() {
            if gh release view latest >/dev/null 2>&1; then
              if [ -n "$FILES" ]; then gh release upload latest $FILES --clobber || return 1; fi
              gh release edit latest --title "$TITLE" --notes-file out/REPORT.md --prerelease
            else
              gh release create latest $FILES --target "$GITHUB_SHA" --title "$TITLE" --notes-file out/REPORT.md --prerelease
            fi
          }
          publish || { sleep 20; publish; } || { sleep 60; publish; }

  # Builds the same app for the browser and adds b1g-web.zip to the "latest" release.
  # Runs in its own job, so a web problem never blocks the APK. Note: in browsers only
  # https HLS streams play reliably (mixed-content and CORS limits of the web platform).
  web:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Brand: name, package and website from brand/brand.txt; icons and logos from brand/*.png.
      - name: Apply the brand
        run: |
          get() { grep -E "^$1=" brand/brand.txt | head -1 | cut -d= -f2- | sed 's/[[:space:]]*$//'; }
          APP_NAME="$(get APP_NAME)"; PACKAGE_ID="$(get PACKAGE_ID)"; WEBSITE="$(get WEBSITE)"
          WEBSITE="${WEBSITE%/}"
          API_BASE=""; [ -n "$WEBSITE" ] && API_BASE="$WEBSITE/wp-json/b1g/v1"
          APK_NAME="$(echo "$APP_NAME" | tr -cd '[:alnum:]')"; [ -n "$APK_NAME" ] || APK_NAME=App
          { echo "APP_NAME=$APP_NAME"; echo "APP_ID=$PACKAGE_ID"; echo "API_BASE=$API_BASE"; echo "APK_NAME=$APK_NAME"; } >> "$GITHUB_ENV"
          echo "brand: $APP_NAME ($PACKAGE_ID) website: ${WEBSITE:-(not set)}"
          python3 -m pip install --quiet pillow || true
          python3 tools/fetch_brand.py "$WEBSITE"
          python3 tools/brand_icons.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the web project
        run: |
          flutter create --no-pub --platforms=web --org com.b1g --project-name b1gtv "$RUNNER_TEMP/webscaffold"
          cp -r "$RUNNER_TEMP/webscaffold/web" web
          # Brand the web app: icons, title and manifest instead of the Flutter defaults.
          cp web_brand/favicon.png web/favicon.png
          cp web_brand/icons/Icon-192.png web/icons/Icon-192.png
          cp web_brand/icons/Icon-512.png web/icons/Icon-512.png
          cp web_brand/icons/Icon-maskable-192.png web/icons/Icon-maskable-192.png
          cp web_brand/icons/Icon-maskable-512.png web/icons/Icon-maskable-512.png
          sed -i "s|<title>b1gtv</title>|<title>$APP_NAME</title>|" web/index.html
          sed -i "s|content=\"b1gtv\"|content=\"$APP_NAME\"|g" web/index.html
          sed -i "s|\"b1gtv\"|\"$APP_NAME\"|g; s|#0175C2|#0A0C10|g" web/manifest.json

      - name: Build the web app
        id: webbuild
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p outweb
          SERVER="$(tr -d ' \r\n' < config/server.txt)"
          {
            flutter pub get
            flutter build web --release \
              --dart-define=B1G_SERVER="$SERVER" --dart-define=B1G_TMDB_KEY="$TMDB_API_KEY" \
              --dart-define=APP_NAME="$APP_NAME" --dart-define=B1G_API_BASE="$API_BASE"
          } 2>&1 | tee outweb/web.log
          # Relative base href, so the app also runs from a subfolder
          # (e.g. /wp-content/uploads/b1g-web/ on the WordPress site).
          sed -i 's|<base href="/">|<base href="./">|' build/web/index.html
          (cd build/web && zip -qr "$GITHUB_WORKSPACE/b1g-web.zip" .)

      - name: Add b1g-web.zip to the release
        if: steps.webbuild.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upload() { gh release upload latest b1g-web.zip --clobber; }
          upload || { sleep 20; upload; } || { sleep 60; upload; }

      # The web result (or its error) goes into the release notes, so it can be read anywhere.
      - name: Report the web result in the release notes
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo ""
            echo "### Web build (b1g-web.zip)"
            echo '```'
            if [ "${{ steps.webbuild.outcome }}" = "success" ]; then
              echo "OK - b1g-web.zip attached ($(stat -c%s b1g-web.zip 2>/dev/null || echo '?') bytes)"
            else
              echo "FAILED - last errors:"
              grep -hiE "error|exception|unsupported|not found|failed" outweb/web.log 2>/dev/null | tail -30 || tail -30 outweb/web.log 2>/dev/null || echo "(no log)"
            fi
            echo '```'
          } > "$RUNNER_TEMP/webnote.md"
          gh release view latest --json body -q .body > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/webnote.md" >> "$RUNNER_TEMP/body.md"
          gh release edit latest --notes-file "$RUNNER_TEMP/body.md"

  # Runs the test build on an emulator with a TV-sized screen and drives it with remote-control
  # keys against a mock IPTV server (ci/smoke.py). Screenshots go to the branch "ci-smoke".
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: b1g-smoke
          path: out/smoke-apk

      - name: Make the test videos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
          ci/make_media.sh

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 4096
          script: python3 ci/smoke.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1g-smoke-result
          path: out/smoke/
          if-no-files-found: warn

      - name: Add the test result to the release notes
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f out/smoke/SMOKE.md ] || { mkdir -p out/smoke; printf '### Emulator test\n\nThe emulator test did not produce a result.\n' > out/smoke/SMOKE.md; }
          gh release view latest --json body -q .body > "$RUNNER_TEMP/body.md"
          { echo ""; cat out/smoke/SMOKE.md; } >> "$RUNNER_TEMP/body.md"
          gh release edit latest --notes-file "$RUNNER_TEMP/body.md"
          # The title says whether this build may go to the TVs. "FAILED" when the app does not open
          # (the website never announces such a build); only a build that opened and signed in on the
          # emulator gets the plain "… build #N".
          NAME="$(gh release view latest --json name -q .name)"
          case "$NAME" in
            *"build #$BUILD_NUMBER "*|*"build #$BUILD_NUMBER") ;;
            *) echo "The release already holds another build ($NAME): title left as it is."; exit 0 ;;
          esac
          APP="${NAME%% - build #*}"
          if grep -qE '^FAIL  (app installs|app starts on the sign-in screen|sign in with the remote opens the home screen)' out/smoke/SMOKE.md; then
            TITLE="$APP - build #$BUILD_NUMBER FAILED: the app does not open (emulator test) - do not send it to the TVs"
          elif grep -qE '^PASS  sign in with the remote opens the home screen' out/smoke/SMOKE.md; then
            TITLE="$APP - build #$BUILD_NUMBER"
          else
            TITLE="$APP - build #$BUILD_NUMBER (emulator test did not finish)"
          fi
          echo "release title: $TITLE"
          gh release edit latest --title "$TITLE"

      - name: Publish the test screenshots
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$RUNNER_TEMP/smoke-branch"; rm -rf "$D"; mkdir -p "$D"
          cp out/smoke/*.png out/smoke/*.md out/smoke/app-log.txt out/smoke/mock-server.log "$D"/ 2>/dev/null || true
          { grep -E "flutter|FATAL|AndroidRuntime|MediaCodec|b1gtv" out/smoke/logcat.txt | cut -c1-400 | tail -3000; } > "$D/logcat-filtered.txt" 2>/dev/null || true
          { grep -E "flutter|FATAL|AndroidRuntime|ANR|lowmemorykiller|am_crash|b1gtv|liteplayer|ExoPlayer|MediaCodec|OutOfMemory" out/smoke/logcat-live.txt | cut -c1-400 | tail -4000; } > "$D/logcat-live-filtered.txt" 2>/dev/null || true
          tail -300 out/smoke/logcat-live.txt 2>/dev/null | cut -c1-400 > "$D/logcat-live-tail.txt" || true
          cd "$D"
          git init -q && git checkout -q -b ci-smoke && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "B1G emulator test output (build $BUILD_NUMBER)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-smoke
