name: Admin Panel app

# Builds the Admin Panel Android app (admin_app/) for resellers and providers.
# Result: release "admin-latest" with AdminPanel.apk, signed with the same key secrets as the player.

on:
  push:
    branches: [main]
    paths: ['admin_app/**', '.github/workflows/admin.yml', 'brand/**']
  workflow_dispatch:

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Website from the brand
        run: |
          get() { grep -E "^$1=" brand/brand.txt | head -1 | cut -d= -f2- | sed 's/[[:space:]]*$//'; }
          WEBSITE="$(get WEBSITE)"; WEBSITE="${WEBSITE%/}"
          echo "SITE=$WEBSITE" >> "$GITHUB_ENV"
          echo "website: ${WEBSITE:-(none - typed on the sign-in screen)}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project
        working-directory: admin_app
        run: |
          flutter create --platforms=android --org com.liteplayer --project-name lite_admin --no-pub .
          rm -rf test   # the template test belongs to the counter demo, not this app
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <application|' "$M"
          sed -i 's|android:label="[^"]*"|android:label="Admin Panel"|' "$M"
          # Server health checks IPTV servers, which are plain http.
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$M"
          grep -n "permission\|label" "$M"
          # App icon: the brand symbol on the dark brand colour.
          python3 -m pip install --quiet pillow || true
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          # Admin icon: brand symbol + gold admin shield + ADMIN tag (brand/admin-icon.png).
          src = Image.open('../brand/admin-icon.png').convert('RGBA')
          for name, k in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              s = round(48 * k)
              img = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              m = Image.new('L', (s, s), 0); ImageDraw.Draw(m).rounded_rectangle([0, 0, s - 1, s - 1], radius=round(s * .22), fill=255)
              img.paste(src.resize((s, s), Image.LANCZOS), (0, 0), m)
              img.save('android/app/src/main/res/mipmap-%s/ic_launcher.png' % name)
          PY

      - name: Get packages
        working-directory: admin_app
        run: flutter pub get

      - name: Check the code
        working-directory: admin_app
        run: |
          mkdir -p ../out
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../out/analyze.log

      - name: Build AdminPanel.apk
        working-directory: admin_app
        run: |
          set -o pipefail
          flutter build apk --release --build-name "1.0.${{ github.run_number }}" --build-number "${{ github.run_number }}" \
            --dart-define=SITE="$SITE" 2>&1 | tee ../out/build.log
          mkdir -p ../out && cp build/app/outputs/flutter-apk/app-release.apk ../out/AdminPanel.apk

      - name: Sign with your own key (v1 + v2 + v3) and make small phone APKs
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # Aligned for every phone (16 KB pages too) and signed with all three schemes, so old and
          # new package installers alike accept it. Same version number for every file.
          sign() {
            # Old signature files out first (a fresh v1 signature is written).
            zip -q -d "$1" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' >/dev/null 2>&1 || true
            "$BT/zipalign" -f -P 16 4 "$1" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$2" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/aligned.apk"
          }
          cp out/AdminPanel.apk "$RUNNER_TEMP/universal.apk"
          sign "$RUNNER_TEMP/universal.apk" out/AdminPanel.apk
          # Phones need only their own processor type: much smaller downloads.
          for pair in arm64-v8a:arm64 armeabi-v7a:arm32; do
            abi="${pair%%:*}"; name="${pair##*:}"
            cp "$RUNNER_TEMP/universal.apk" "$RUNNER_TEMP/$name.apk"
            for other in arm64-v8a armeabi-v7a x86_64; do
              [ "$other" = "$abi" ] || zip -q -d "$RUNNER_TEMP/$name.apk" "lib/$other/*" || true
            done
            sign "$RUNNER_TEMP/$name.apk" "out/AdminPanel-$name.apk"
          done
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP"/*.apk
          ls -la out/*.apk

      - name: Check the APKs (signature, Android versions, alignment)
        if: always()
        run: |
          [ -f out/AdminPanel.apk ] || exit 0
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            "$BT/aapt2" dump badging out/AdminPanel.apk 2>&1 | grep -E "^package|dkVersion|native-code|^application:" | head -6
            for f in out/AdminPanel*.apk; do
              echo
              echo "== $(basename "$f")  $(du -m "$f" | cut -f1) MB  sha256 $(sha256sum "$f" | cut -c1-16)"
              "$BT/apksigner" verify --verbose "$f" 2>&1 | grep -E "^Verifies|^DOES NOT|v1 scheme|v2 scheme|v3 scheme|ERROR" | head -6
              "$BT/zipalign" -c -P 16 4 "$f" >/dev/null 2>&1 && echo "zipalign: OK" || echo "zipalign: NOT aligned"
              "$BT/aapt2" dump badging "$f" 2>&1 | grep -E "^native-code" | head -1
            done
          } | tee out/CHECK.txt

      - name: Publish to the "admin-latest" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Admin Panel - build #${{ github.run_number }}"
          FILES=""
          for f in out/AdminPanel.apk out/AdminPanel-arm64.apk out/AdminPanel-arm32.apk; do [ -f "$f" ] && FILES="$FILES $f"; done
          [ -z "$FILES" ] && TITLE="$TITLE FAILED"
          {
            echo "Admin Panel app for resellers/providers. Website: ${SITE:-typed on sign-in}. Signed with own key: $HAS_SIGNING"
            echo
            echo "Phones: AdminPanel-arm64.apk (almost every phone from 2017 on). Older 32-bit phones: AdminPanel-arm32.apk."
            echo "AdminPanel.apk holds every processor type (bigger download)."
            echo
            echo '### APK check'
            echo '```'
            cat out/CHECK.txt 2>/dev/null || true
            echo '```'
            echo '### Errors'
            echo '```'
            grep -h -E "error •|Error:|error:" out/analyze.log out/build.log 2>/dev/null | head -40 || true
            echo '```'
          } > out/NOTES.md
          if gh release view admin-latest >/dev/null 2>&1; then
            [ -n "$FILES" ] && gh release upload admin-latest $FILES --clobber
            gh release edit admin-latest --title "$TITLE" --notes-file out/NOTES.md --prerelease
          else
            gh release create admin-latest $FILES --target "$GITHUB_SHA" --title "$TITLE" --notes-file out/NOTES.md --prerelease
          fi
