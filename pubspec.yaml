name: b1gtv
description: Lite Player - IPTV player for Android TV and Fire TV (live TV, movies and series).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  archive: ^3.6.1
  qr_flutter: ^4.1.0
  media_kit: ^1.1.10
  crypto: ^3.0.3
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.3.6
  path_provider: ^2.1.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  # shared_preferences_android 2.5.0 (17 Oct 2026, "Pigeon JNI") fails in release APKs: the app
  # cannot read its settings ("NoSuchMethodError ... SharedPreferencesApiRegistrar.getAll") and
  # stays on the start logo. 2.4.29 is the last version before that change. Remove this pin only
  # after the emulator test (release notes, "app starts on the sign-in screen") passes with a newer one.
  shared_preferences_android: 2.4.29

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/symbol.png
    - assets/intro_sound.mp3
    - assets/home_bg.webp
    - assets/wallpapers/
