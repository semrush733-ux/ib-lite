<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1">
<title>Lite Player</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="stage">
  <div id="vlayer"><video id="vid" class="hide" preload="none"></video></div>
  <div id="screens"></div>
  <div id="dlg"></div>
  <div id="toast"></div>
  <!-- Start screen: the symbol, then the name written letter by letter; the soft pulse only when
       the app needs longer (a new TV registering). -->
  <div id="intro">
    <div class="glowbg"></div>
    <div class="brand"><span class="sym"><img id="introSym" src="img/symbol.png" alt=""></span><span class="name" id="introName"></span></div>
    <div class="pulse"><i class="ring"></i><i class="glow"></i><i class="dot"></i></div>
  </div>
</div>
<script src="js/config.js"></script>
<script>
  /* The start animation runs alone: the app's own scripts load only after the name is written,
     so even the cheapest TV has nothing else to do while it draws the letters. */
  (function () {
    var name = '', icon = '';
    try {
      var b = JSON.parse(localStorage.getItem('lt_brand') || 'null');
      if (b) { name = b.logoName || b.name || ''; icon = b.iconData || ''; }
    } catch (e) {}
    if (!name) name = (window.CONFIG && CONFIG.appName) || 'Lite Player';
    document.title = (window.CONFIG && CONFIG.appName) || name;
    var intro = document.getElementById('intro');
    var sym = document.getElementById('introSym');
    if (icon) sym.src = icon;

    // The name: the first word white, the rest red, one letter after the other.
    var el = document.getElementById('introName');
    var first = name.indexOf(' '), n = name.length;
    var step = Math.min(36, Math.round(560 / Math.max(1, n - 1))), start = 260, each = 460;
    for (var i = 0; i < n; i++) {
      var c = document.createElement('span');
      c.className = 'ch ' + (first > 0 && i >= first ? 'r' : 'w');
      c.textContent = name.charAt(i) === ' ' ? ' ' : name.charAt(i);
      c.style.webkitAnimationDelay = c.style.animationDelay = (start + i * step) + 'ms';
      el.appendChild(c);
    }
    var length = start + (n - 1) * step + each; // when the last letter is in place

    // Pages wider or narrower than 1920 (browser tests, old TVs) are scaled as a whole.
    var s = (window.innerWidth || 1920) / 1920;
    if (Math.abs(s - 1) > 0.01) {
      var st = document.getElementById('stage');
      st.style.webkitTransform = 'scale(' + s + ')';
      st.style.transform = 'scale(' + s + ')';
    }

    var INTRO = window.INTRO = { t0: Date.now(), written: 0 };
    var APP = ['core', 'i18n', 'qr', 'ui', 'backend', 'xmltv', 'sources', 'demo', 'player', 'screens', 'privacy', 'system', 'profiles', 'browse', 'tmdb', 'details', 'streaming', 'playerui', 'guide', 'main'];
    // The texts of the language in use (Settings › Language; English until one is chosen): only that one file loads.
    var LANGS = 'ar bn de es fa fr hi id it ja ko mr nl pa pl pt ru ta te th tr ur vi zh';
    (function () {
      var c = 'en';
      try { var v = JSON.parse(localStorage.getItem('lt_ui_lang') || '"en"'); if (typeof v === 'string' && v) c = v; } catch (e) {}
      if (c === 'auto') c = String(navigator.language || 'en').toLowerCase().substring(0, 2);
      if (c !== 'en' && (' ' + LANGS + ' ').indexOf(' ' + c + ' ') >= 0) APP.splice(2, 0, 'lang/' + c);
    })();
    function loadApp() {
      for (var k = 0; k < APP.length; k++) {
        var js = document.createElement('script');
        js.src = 'js/' + APP[k] + '.js';
        js.async = false; // in this order
        document.body.appendChild(js);
      }
    }
    var begun = false;
    function begin() {
      if (begun) return;
      begun = true;
      intro.className = 'go';
      INTRO.written = Date.now() + length;
      setTimeout(function () {
        // Written: the letters become part of the picture (nothing moves any more).
        if (intro.className === 'go') intro.className = 'go done';
        loadApp();
      }, length + 40);
      // Still here a while after the name was written (a new TV registering): the soft pulse.
      setTimeout(function () { if (intro.parentNode && !/out|warm/.test(intro.className)) intro.className += ' wait'; }, length + 1500);
    }
    // The letters start once the name's font and the symbol are ready, so nothing pops in late.
    var waiting = 2;
    function ready() { if (--waiting <= 0) begin(); }
    if (document.fonts && document.fonts.load) {
      document.fonts.load('700 124px Brand').then(ready, ready);
    } else setTimeout(ready, 150);
    if (sym.complete) ready(); else { sym.onload = sym.onerror = ready; }
    setTimeout(begin, 700); // never later than this
  })();
</script>
</body>
</html>
