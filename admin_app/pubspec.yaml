name: lite_admin
description: Admin Panel for Lite Player providers and resellers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  mobile_scanner: '>=5.2.0 <8.0.0'
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  url_launcher: ^6.3.0

dependency_overrides:
  # shared_preferences_android 2.5.0 (17 Oct 2026, "Pigeon JNI") fails in release APKs
  # ("NoSuchMethodError ... SharedPreferencesApiRegistrar.getAll"): the saved login cannot be
  # read. 2.4.29 is the last version before that change (same pin as the TV app).
  shared_preferences_android: 2.4.29

flutter:
  uses-material-design: true
