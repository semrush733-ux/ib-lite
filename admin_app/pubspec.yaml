name: lite_admin
description: Admin Panel for Lite Player providers and resellers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  mobile_scanner: '>=5.2.0 <8.0.0'
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  url_launcher: ^6.3.0

dependency_overrides:
  # shared_preferences_android 2.5.0 (17 Oct 2026, "Pigeon JNI") fails in release APKs
  # ("NoSuchMethodError ... SharedPreferencesApiRegistrar.getAll"): the saved login cannot be
  # read. Any 2.4.x is from before that change (same pin as the TV app).
  shared_preferences_android: ">=2.4.0 <2.5.0"
  # The iPhone side of the same change (shared_preferences_foundation 2.6.0, "FFI") does not
  # compile on the cloud Mac ("Swift Compiler Error: Unexpected ',' separator" in messages.g.swift),
  # so no new AdminPanel.ipa was made after 16 Oct. Any 2.5.x is from before that change.
  shared_preferences_foundation: ">=2.5.0 <2.6.0"

flutter:
  uses-material-design: true
